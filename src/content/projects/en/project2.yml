title: "Split4Me App"
description: "Legacy expense-splitting apps have systematically enclosed their core value propositions within high-cost, recurring subscription paywalls. Split4Me app remain fully functional without requiring an upfront registration wall."
technologies:
  - App Design
  - Product Design
  - UX/UI
  - Figma
thumbnail: "../../../assets/images/split4me-mock.png"
demoUrl: "/projects/split4me-app"
repoUrl: ""
category: ""
slug: "split4me-app"
pageContent:
  intro:
    mockupImage: "../../../assets/images/split-app-dashboard.png"
    mockupAlt: "Mockup of the Split4Me App main screen"
    problemHeading: "Problem"
    problemDescription: "Many shared expense apps have evolved toward high-cost subscription models, locking basic features behind paywalls."
    solutionHeading: "Solution"
    solutionDescription: "Propose a privacy-centered alternative, avoiding artificial paywalls to gain competitive advantage and reduce friction from legacy apps."
  process:
    heading: "Process"
    description: "The process begins with research into the evolution and disruption in expense-splitting apps. Once economically viable solutions and alternatives have been explored, a decision is made on an MVP."
    steps:
      - label: "Research"
        description: "Legacy app analysis and product definition"
        detail:
          paragraphs:
            - "Having Gemini as a strategic partner, I explored the competitive landscape to summarize characteristics, offers, and value propositions of competitors. It also helped me understand financial calculations and other concepts of today's economy."
          extra:
            type: story
            heading: "User stories & MVP"
            description: "Research findings are translated into user stories to decide on a feature list and acceptance criteria for the MVP."
            quote: "As the account manager, I want to copy a settlement summary to my clipboard so I can share it with the group over WhatsApp."
      - label: "Prototyping"
        description: "User flow · Wireframes"
        detail:
          paragraphs:
            - "The main flow is triggered by the decision to share an expense, a journey that's a familiar pattern for users of this kind of app. The features that carry the privacy value proposition, on the other hand, are introduced during onboarding."
          extra:
            type: image
            image: "../../../assets/images/split4me-onboarding.png"
            imageAlt: "Onboarding screen explaining that data stays on the user's device"
      - label: "Design"
        description: "Design · UI Kit"
        detail:
          paragraphs:
            - "The color palette is based on the brand color as the primary tone for buttons, headings, and other components. Other interface colors carry semantic meaning: what I'm owed and what I owe."
  features:
    heading: "Project"
    description: "Split4Me follows a zero-friction approach based on two pillars: deferred authentication, allowing the app to be fully functional immediately without previous registration, and a local-first architecture that decentralizes data storage on the client device."
    items:
      - title: "Personal cloud synchronization"
        description: "Instead of corporate servers, synchronization between devices and backups are performed through the user's own personal and encrypted accounts, such as iCloud Drive (Apple) and Google Drive (Android/Web)."
        image: "../../../assets/images/connect-storage.png"
        imageAlt: "Connect with personal cloud storage"
      - title: "On-device processing"
        description: "Complex tasks such as AI-powered OCR for receipt scanning run locally using the device's hardware, ensuring privacy and reducing network costs."
        image: "../../../assets/images/add-expense.png"
        imageAlt: "New expense via OCR or manual inputs"
      - title: "Fintech affiliation"
        description: "Integrates deep links to settle debts through neobanks. High-frequency users (business travelers or freelancers) can pay for advanced features like bulk export to Excel/CSV or unlimited receipt photo storage."
        image: "../../../assets/images/settle.png"
        imageAlt: "Interface components for settling debt"
