title: "Split4Me App"
description: "Las apps de división de gastos han encerrado sistemáticamente sus propuestas de valor principales dentro de muros de pago de suscripción recurrente de alto costo. La app Split4Me permanece completamente funcional sin requerir registro previo."
technologies:
  - App Design
  - Product Design
  - UX/UI
  - Figma
thumbnail: "../../../assets/images/split4me-mock.png"
demoUrl: "/es/projects/split4me-app"
repoUrl: ""
category: ""
slug: "split4me-app"
pageContent:
  intro:
    mockupImage: "../../../assets/images/split-app-dashboard.png"
    mockupAlt: "Mockup de la pantalla principal de Split4Me App"
    problemHeading: "Problema"
    problemDescription: "Muchas apps para gastos compartidos han evolucionado hacia modelos de suscripción de alto costo, encerrando funciones básicas tras muros de pago."
    solutionHeading: "Solución"
    solutionDescription: "Plantear una alternativa centrada en la privacidad, evitando los muros de pago artificiales para ganar ventaja competitiva y reducir las fricciones de las apps legacy."
  process:
    heading: "Proceso"
    description: "El camino parte con la investigación de la evolución y disrupción en apps de gastos compartidos. Una vez exploradas soluciones y alternativas de viabilidad económica, se decide un MVP."
    steps:
      - label: "Research"
        description: "Análisis de apps legacy y definción de producto"
        detail:
          paragraphs:
            - "Teniendo a Gemini como aliado estratégico exploré el panorama competitivo para resumir características, ofertas y propuestas de valor de los competidores. Además me ayudó a comprender cálculos financieros y otros conceptos de la economía actual."
          extra:
            type: story
            heading: "User stories y MVP"
            description: "Los resultados de la investigación se vuelcan en historias de usuarios para decidir una lista de features y criterios de aceptación para el MVP."
            quote: "Como gestor de la cuenta, quiero copiar un resumen de liquidación a mi portapapeles para poder compartirlo por WhatsApp al grupo."
      - label: "Prototyping"
        description: "User flow · Wireframes"
        detail:
          paragraphs:
            - "El flujo principal lo dispara la decisión de compartir un gasto. Este recorrido es un patrón familiar para el usuario de este tipo de apps. Por otro lado, las features que aportan el valor de la privacidad se presentan en el onboarding."
          extra:
            type: image
            image: "../../../assets/images/split4me-onboarding.png"
            imageAlt: "Pantalla de onboarding explicando que los datos se quedan en el dispositivo del usuario"
      - label: "Design"
        description: "Design · UI Kit"
        detail:
          paragraphs:
            - "La paleta cromática se basa en el color de la marca como tonalidad primaria para botones, titulares y otros componentes. Otros colores de la interfaz tienen un valor semántico: lo que me deben y lo que debo."
      - label: "Desarrollo"
        description: "Spec-driven development"
  features:
    heading: "Proyecto"
    description: "Split4Me sigue un enfoque de fricción cero que se basa en dos pilares: autenticación diferida, permitiendo que la aplicación sea plenamente funcional de inmediato sin registro previo. Y la arquitectura local-first que descentraliza el almacenamiento de datos en el dispositivo del cliente."
    items:
      - title: "Sincronización en nubes personales"
        description: "En lugar de servidores corporativos, la sincronización entre dispositivos y los respaldos se realizan a través de las cuentas personales y cifradas del propio usuario, como iCloud Drive (Apple) y Google Drive (Android/Web)."
        image: "../../../assets/images/connect-storage.png"
        imageAlt: "Conectar con cloud personal"
      - title: "Procesamiento en el dispositivo"
        description: "Tareas complejas como el OCR con IA para el escaneo de recibos se ejecutan localmente utilizando el hardware del terminal, lo que garantiza privacidad y reduce costos de red."
        image: "../../../assets/images/add-expense.png"
        imageAlt: "Nuevo gasto via OCR o desde inputs"
      - title: "Afilización fintech"
        description: "Integra enlaces profundos (deep-links) para liquidar deudas a través de neobancos. Usuarios de alta frecuencia (viajeros de negocios o autónomos) pueden pagar por funciones avanzadas como exportación masiva a Excel/CSV o almacenamiento ilimitado de fotos de recibos."
        image: "../../../assets/images/settle.png"
        imageAlt: "Componentes de interfaz para saldar la deuda"
  externalLinks:
    - type: figma
      url: "https://www.figma.com/design/eHTvK8tdJGnNJVczk604tc/Split4Me-app?node-id=159-203&t=f0dGeQyzfGAScLpv-1"
      label: "Ver el proyecto en Figma"
      ariaLabel: "Ver el proyecto en Figma"
